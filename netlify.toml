# Deployment configuration — TAD §18 / §19.4 (ADR-0009).
# Netlify is the primary host; the deciding factor is Netlify Forms (no
# backend code, no secrets — invariant I3). Cloudflare Pages is the
# documented drop-in alternative.

[build]
  # robots.mjs rewrites dist/robots.txt to Disallow: / on non-production
  # deploys (TD-4); Netlify's CONTEXT decides.
  command = "npm run build && node scripts/robots.mjs"
  publish = "dist"

# ── Security headers (TAD §19.4) ──────────────────────────────────────────

[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# BEGIN CSP — generated by scripts/generate-csp.mjs (do not edit by hand)
# Strict CSP per TAD §19.3: hash-allowlisted inline scripts/styles, no
# unsafe-inline. The union of every page's hashes covers content swapped
# in by ClientRouter navigations (D-042). frame-ancestors blocks
# clickjacking; it can only be delivered via header, not <meta>.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-CF7mkPHbuFhQgsLmlWr8AW8KF5WxpzvJJy132W+qbJc=' 'sha256-HEmEm/ztV4hlI97d/VbcQywqwPvVIPPgN1g8p9uS7fc=' 'sha256-Lk4lvyz3Le2SNnKSNhNnZx+dGteut24hI5g29epf3W8=' 'sha256-Q2BPg90ZMplYY+FSdApNErhpWafg2hcRRbndmvxuL/Q=' 'sha256-QzWFZi+FLIx23tnm9SBU4aEgx4x8DsuASP07mfqol/c=' 'sha256-SaCkFfPruIdTXT8/97JArQmGxiJAL2o4bBDvSgJ5y3Q=' 'sha256-x0+FfcxcK8kb3UGeIQ5N/IRGoIi860dk5IuryHOLNKk=' 'sha256-ybohMehqO0S+DLDJLQGxMMEYj3lWoQ8Vod0wkBEfypM='; style-src 'self' 'sha256-14OJas0Saos5Wvp/W8/hvsVZI99Kn1MNxfK18p8fons=' 'sha256-ESSTDEI2+zSIaJ3d/pMbwSE1Xhkehh0rMBszX6Fjguw=' 'sha256-JDhMRJk1e1GZJMUuIPV7SklmUOPw36I3SKhTKbBBhqg=' 'sha256-K7fmbJ3bpsHg4KULtDJHz+AMA5CCpViKg9c98qv8Dvg=' 'sha256-PQTf/3mu3EtxBoQWDvb0+BOKQGBRTxNrTjjfLsUuDCw=' 'sha256-SqZ48fc7mlHY4UdH0ylVF04tgBbxgJ3kiAEwiJp+g6k=' 'sha256-aQR/BteJIpEDLhAxTWdvXX/cc8d9nlq7ums/SVBYEmk=' 'sha256-bD5YVOo8nX1S1XGbrhinVTV3VrGSNST0xYoBHuL+x8c=' 'sha256-lAJFnMXqCTeyAdbiAJpcFn/ho4JZNcPHfDybXRlyz5k=' 'sha256-n7AJ1NIcl4yrO7xwSmlkavik2GDuVT3i482Dt0jnhSI=' 'sha256-pSt6cOLmr+MUsHtNsJK4d/MLiW9wAFTJiXR/hggj0SI=' 'sha256-qR7RVkRBPecqfrW46vaWQAV/8lgPIPjcBHqBrCilLf4=' 'sha256-vv9IoKo7BSLbWcUHr3tNmfNVmm5L/9Cfn2H6LMk7/ow=' 'sha256-yPMHzB5ryz9GK0cQWYadcumXT6kivamyVp3OrGAPj3o=' 'sha256-yWGRZ4UFFsKGUVoS0QbvULJ5RMV/qL+IrYVuClD8Po0='; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests"
# END CSP

# ── Caching (TAD §14.7) ───────────────────────────────────────────────────
# Hashed build assets are immutable; HTML stays fresh via platform defaults.

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/search-index.json"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

